<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>瞬間英作文</title>
  </head>
  <body>
  <h1>瞬間英作文</h1>

  <p id="question">ここに日本語の問題が出る</p>

  <form id="answer-form">
    <input id="answer" type="text" placeholder="英語で答える" autocomplete="off" />
    <button type="submit">送信</button>
  </form>

  <section id="result" hidden>
    <p>あなたの回答：<span id="your-answer"></span></p>
    <button id="next" type="button">次へ</button>
  </section>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
